spring:
  application:
    name: leadflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/leadflow}
    username: ${POSTGRES_USER:leadflow}
    password: ${POSTGRES_PASSWORD:change_me_locally}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: leadflow-pool
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    diskspace:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  jwt-secret: ${APP_JWT_SECRET:replace_with_a_long_random_secret_at_least_32_chars}
  jwt-expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:480}
  webhook-secret: ${N8N_WEBHOOK_SECRET:replace_with_a_long_random_secret_at_least_32_chars}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  demo-mode: ${DEMO_MODE:false}
  prompt-version: ${QUALIFICATION_PROMPT_VERSION:v1}
  http-timeout-ms: ${AI_HTTP_TIMEOUT_MS:20000}
  email-provider: ${EMAIL_PROVIDER:console}
  cookie:
    name: lf_session
    secure: ${APP_COOKIE_SECURE:false}
  automation:
    qualify-url: ${N8N_WEBHOOK_QUALIFY_URL:http://n8n:5678/webhook/leadflow/qualify}
    email-draft-url: ${N8N_WEBHOOK_EMAIL_DRAFT_URL:http://n8n:5678/webhook/leadflow/email-draft}
    email-send-url: ${N8N_WEBHOOK_EMAIL_SEND_URL:http://n8n:5678/webhook/leadflow/email-send}

logging:
  level:
    com.leadflowai.leadflow: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %X{traceId:-} %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: prod
app:
  cookie:
    secure: true
logging:
  level:
    com.leadflowai.leadflow: INFO
